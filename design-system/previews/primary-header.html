<!doctype html>
<html lang="en">
  <head>

    <title>Primary header preview</title>

    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../css/documentation.css" />
    <script type="module" src="../../js/main.js"></script>
  </head>

      <a
        class="primary-header__logo"
        href="../../index.html"

          <li>
            <a class="nav-link" href="../../index.html" aria-current="page">
              <span>00</span>Home

          </li>
          <li>
            <a class="nav-link" href="#destination"><span>01</span>Destination</a>

          <li>
