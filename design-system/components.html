<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Reusable component catalogue for the Space Tourism website." />

  <title>Components | Space Tourism</title>

  <link rel="icon" href="../assets/favicon-32x32.png" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="css/documentation.css" />
  <script type="module" src="js/component-examples.js"></script>
</head>

<body>
  <div class="container">
    <header class="docs-header">
      <a href="../index.html" aria-label="Space Tourism home">
        <img src="../assets/shared/logo.svg" alt="" />
      </a>
      <h1>Components</h1>
    </header>

    <nav class="docs-nav" aria-label="Design system">
      <a href="index.html">Style guide</a>
      <a href="components.html" aria-current="page">Components</a>
    </nav>

    <main class="docs-main">
      <section
        id="single-components"
        class="docs-section"
        aria-labelledby="single-components-title">
        <h2 class="docs-section-title" id="single-components-title">
          <span>01</span>Single components
        </h2>

        <div class="component-grid">
          <figure class="component-demo" id="navigation-demo">
            <figcaption class="component-demo__title">
              Navigation states — desktop and tablet
            </figcaption>
            <div class="component-demo__surface">
              <nav aria-label="Desktop navigation state examples">
                <ul class="nav-list">
                  <li>
                    <a class="nav-link" href="#navigation-demo">
                      <span>00</span>Menu
                    </a>
                  </li>
                  <li>
                    <a class="nav-link" href="#navigation-demo" data-demo-state="hover">
                      <span>00</span>Menu
                    </a>
                  </li>
                  <li>
                    <a class="nav-link" href="#navigation-demo" aria-current="page">
                      <span>00</span>Menu
                    </a>
                  </li>
                </ul>
              </nav>
            </div>
          </figure>

          <figure class="component-demo">
            <figcaption class="component-demo__title">
              Navigation states — mobile
            </figcaption>
            <div class="component-demo__surface">
              <div class="responsive-preview-viewport">
                <iframe style="--preview-height: 15rem;"
                  class="responsive-preview-frame responsive-preview-frame--mobile"
                  src="previews/mobile-navigation-states.html"
                  title="Navigation component preview"
                  loading="lazy">
                </iframe>
              </div>
            </div>
          </figure>

          <figure class="component-demo component-demo--wide">
            <figcaption class="component-demo__title">
              Tab states
            </figcaption>
            <div class="component-demo__surface">
              <div class="tab-list" aria-label="Tab state examples">
                <button class="tab" type="button">
                  Tab menu
                </button>
                <button class="tab" type="button" data-demo-state="hover">
                  Tab menu
                </button>
                <button class="tab" type="button" data-demo-state="selected">
                  Tab menu
                </button>
              </div>
            </div>
          </figure>

          <figure class="component-demo component-demo--wide">
            <figcaption class="component-demo__title">
              Explore button states — desktop and tablet
            </figcaption>
            <div class="component-demo__surface component-demo__surface--buttons">
              <a class="explore-button" href="#grouped-components">
                Explore
              </a>
              <a class="explore-button" href="#grouped-components" data-demo-state="hover">
                Explore
              </a>
            </div>
          </figure>

          <figure class="component-demo component-demo--wide">
            <figcaption class="component-demo__title">
              Explore button states — mobile
            </figcaption>
            <div class="component-demo__surface component-demo__surface--buttons">
              <a class="explore-button explore-button--small" href="#grouped-components">
                Explore
              </a>
              <a
                class="explore-button explore-button--small"
                href="#grouped-components"
                data-demo-state="hover">
                Explore
              </a>
            </div>
          </figure>

          <figure class="component-demo">
            <figcaption class="component-demo__title">
              Dot pagination — desktop
            </figcaption>
            <div class="component-demo__surface">
              <div class="dot-pagination" role="group" aria-label="Crew member">
                <button type="button" aria-label="View crew member one"></button>
                <button type="button" aria-label="View crew member two" data-demo-state="hover"></button>
                <button type="button" aria-label="View crew member three" aria-current="true"></button>
              </div>
            </div>
          </figure>

          <figure class="component-demo">
            <figcaption class="component-demo__title">
              Dot pagination — mobile
            </figcaption>
            <div class="component-demo__surface">
              <div class="dot-pagination dot-pagination--small" role="group" aria-label="Crew member">
                <button type="button" aria-label="View crew member one"></button>
                <button type="button" aria-label="View crew member two" data-demo-state="hover"></button>
                <button type="button" aria-label="View crew member three" aria-current="true"></button>
              </div>
            </div>
          </figure>

          <figure class="component-demo">
            <figcaption class="component-demo__title">
              Numbered pagination — desktop
            </figcaption>
            <div class="component-demo__surface">
              <div class="numbered-pagination" role="group" aria-label="Technology">
                <button type="button" aria-label="View technology one">
                  1
                </button>
                <button type="button" aria-label="View technology two" data-demo-state="hover">
                  2
                </button>
                <button type="button" aria-label="View technology three" aria-current="true">
                  3
                </button>
              </div>
            </div>
          </figure>

          <figure class="component-demo">
            <figcaption class="component-demo__title">
              Numbered pagination — mobile
            </figcaption>
            <div class="component-demo__surface">
              <div class="numbered-pagination numbered-pagination--small" role="group" aria-label="Technology">
                <button type="button" aria-label="View technology one">
                  1
                </button>
                <button type="button" aria-label="View technology two" data-demo-state="hover">
                  2
                </button>
                <button type="button" aria-label="View technology three" aria-current="true">
                  3
                </button>
              </div>
            </div>
          </figure>
        </div>
      </section>

      <section
        id="grouped-components"
        class="docs-section"
        aria-labelledby="grouped-components-title">
        <h2 class="docs-section-title" id="grouped-components-title">
          <span>02</span>Grouped components
        </h2>
        <div class="component-grid">

          <figure class="component-demo component-demo--wide">
            <figcaption class="component-demo__title">
              Navigation
            </figcaption>
            <div class="component-demo__surface">

              <div class="responsive-preview-viewport flow">

                <iframe
                  style="--preview-height: 8rem;"
                  class="responsive-preview-frame responsive-preview-frame--desktop"
                  src="previews/primary-header.html"
                  title="Primary header desktop preview"
                  loading="lazy">
                </iframe>

                <iframe
                  style="--preview-height: 8rem;"
                  class="responsive-preview-frame responsive-preview-frame--tablet"
                  src="previews/primary-header.html"
                  title="Primary header tablet preview"
                  loading="lazy">
                </iframe>

                <iframe
                  style="--preview-height: 8rem;"
                  class="responsive-preview-frame responsive-preview-frame--mobile"
                  src="previews/primary-header.html"
                  title="Primary header mobile preview"
                  loading="lazy">
                </iframe>

              </div>

            </div>
          </figure>

          <div class="component-variant-grid">
            <figure class="component-demo">
              <figcaption class="component-demo__title">
                Destination tabs — desktop and tablet
              </figcaption>
              <div
                class="component-demo__surface component-demo__surface--matrix component-demo__surface--compact"
                data-example-matrix="destination-tabs"></div>
            </figure>

            <figure class="component-demo">
              <figcaption class="component-demo__title">
                Destination tabs — mobile
              </figcaption>
              <div class="component-demo__surface">
                <div class="responsive-preview-viewport">
                  <iframe
                    style="--preview-height: 18rem;"
                    class="responsive-preview-frame responsive-preview-frame--mobile"
                    src="previews/destination-tabs.html"
                    title="Destination tabs mobile preview"
                    loading="lazy">
                  </iframe>
                </div>
              </div>
            </figure>
          </div>

          <div class="component-variant-grid">
            <figure class="component-demo">
              <figcaption class="component-demo__title">
                Numbered pagination — desktop
              </figcaption>
              <div
                class="component-demo__surface component-demo__surface--matrix component-demo__surface--spacious"
                data-example-matrix="numbered-pagination"></div>
            </figure>

            <figure class="component-demo">
              <figcaption class="component-demo__title">
                Numbered pagination — tablet
              </figcaption>
              <div class="component-demo__surface">
                <div class="responsive-preview-viewport">
                  <iframe
                    style="--preview-height: 18rem;"
                    class="responsive-preview-frame responsive-preview-frame--tablet"
                    src="previews/numbered-pagination.html"
                    title="Numbered pagination tablet preview"
                    loading="lazy">
                  </iframe>

                </div>
              </div>
            </figure>

            <figure class="component-demo">
              <figcaption class="component-demo__title">
                Numbered pagination — mobile
              </figcaption>
              <div class="component-demo__surface">
                <div class="responsive-preview-viewport">
                  <iframe
                    style="--preview-height: 16rem;"
                    class="responsive-preview-frame responsive-preview-frame--mobile"
                    src="previews/numbered-pagination.html"
                    title="Numbered pagination mobile preview"
                    loading="lazy">
                  </iframe>
                </div>
              </div>
            </figure>
          </div>

          <div class="component-variant-grid">
            <figure class="component-demo">
              <figcaption class="component-demo__title">
                Dot pagination — desktop
              </figcaption>
              <div
                class="component-demo__surface component-demo__surface--matrix component-demo__surface--spacious"
                data-example-matrix="dot-pagination"></div>
            </figure>

            <figure class="component-demo">
              <figcaption class="component-demo__title">
                Dot pagination — mobile
              </figcaption>
              <div class="component-demo__surface">
                <div class="responsive-preview-viewport">
                  <iframe
                    style="--preview-height: 12rem;"
                    class="responsive-preview-frame responsive-preview-frame--mobile"
                    src="previews/dot-pagination.html"
                    title="Dot pagination mobile preview"
                    loading="lazy">
                  </iframe>
                </div>
              </div>
            </figure>
          </div>

        </div>
      </section>
    </main>
  </div>
</body>

</html>
